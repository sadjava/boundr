[project]
name = "marlin-finetuning"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "torchcodec==0.16.0",
    "transformers==5.16.1",
    "peft==0.20.0",
    "accelerate==1.14.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
torchcodec = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
